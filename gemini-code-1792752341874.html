<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chillibon: Ледяное приключение</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #0d0f1d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1000px;
            max-height: 600px;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.3);
            border-radius: 12px;
            overflow: hidden;
            background: #101428;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 15, 29, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            font-weight: bold;
            font-size: 16px;
        }
        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hud-icon {
            font-size: 20px;
        }
        .touch-controls {
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            padding: 10px;
            pointer-events: auto;
        }
        .d-pad, .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
        .btn-action {
            background: rgba(255, 105, 180, 0.3);
            border-color: rgba(255, 105, 180, 0.6);
        }
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 24, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .modal h1 {
            font-size: 36px;
            color: #70d6ff;
            text-shadow: 0 0 10px rgba(112, 214, 255, 0.5);
            margin-bottom: 10px;
        }
        .modal p {
            font-size: 16px;
            color: #d8e2dc;
            margin-bottom: 25px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }
        .start-btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #0077b6, #00b4d8);
            border: none;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
            transition: all 0.2s;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.6);
        }
        .boss-health-bar {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 16px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }
        .boss-health-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4d4d, #ff8000);
            transition: width 0.2s;
        }
        .boss-name {
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #ff4d4d;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
        .toast {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ffe600;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid #ffe600;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-overlay">
        <div class="hud">
            <div class="hud-item"><span class="hud-icon">🐟</span> <span id="fish-count">0</span></div>
            <div class="hud-item"><span class="hud-icon">⭐</span> Уровень <span id="level-count">1</span></div>
            <div class="hud-item"><span class="hud-icon">❤️</span> <span id="lives-count">3</span></div>
        </div>

        <div class="boss-health-bar" id="boss-hp-container">
            <div class="boss-name">БОСС: САНЯ</div>
            <div class="boss-health-fill" id="boss-hp-fill"></div>
        </div>

        <div class="toast" id="toast-msg"></div>

        <div class="touch-controls" id="touch-controls">
            <div class="d-pad">
                <div class="btn" id="btn-left">◄</div>
                <div class="btn" id="btn-right">►</div>
            </div>
            <div class="action-buttons">
                <div class="btn btn-action" id="btn-throw">🐟</div>
                <div class="btn" id="btn-jump">▲</div>
            </div>
        </div>
    </div>

    <div class="modal" id="game-modal">
        <h1 id="modal-title">Chillibon</h1>
        <p id="modal-desc">Ледяное приключение начинается! Помоги коту Чиллибону собрать рыбок, преодолеть суровые биомы и встретить загадочного Саню на вершине гор.</p>
        <button class="start-btn" id="modal-btn">Начать приключение</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isMobile) {
    document.getElementById('touch-controls').style.display = 'flex';
}

const keys = {
    left: false,
    right: false,
    jump: false,
    throw: false
};

const inputState = {
    left: false,
    right: false,
    jump: false,
    throw: false,
    jumpPressed: false,
    throwPressed: false
};

window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputState.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') inputState.right = true;
    if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
        if (!inputState.jump) inputState.jumpPressed = true;
        inputState.jump = true;
    }
    if (e.code === 'KeyE') {
        if (!inputState.throw) inputState.throwPressed = true;
        inputState.throw = true;
    }
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputState.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') inputState.right = false;
    if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') inputState.jump = false;
    if (e.code === 'KeyE') inputState.throw = false;
});

function setupTouchButton(id, keyName) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!inputState[keyName]) {
            if (keyName === 'jump') inputState.jumpPressed = true;
            if (keyName === 'throw') inputState.throwPressed = true;
        }
        inputState[keyName] = true;
    });
    btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        inputState[keyName] = false;
    });
}

setupTouchButton('btn-left', 'left');
setupTouchButton('btn-right', 'right');
setupTouchButton('btn-jump', 'jump');
setupTouchButton('btn-throw', 'throw');

const WORLD_WIDTH = 6000;
const WORLD_HEIGHT = 600;
const GRAVITY = 0.55;

let gameState = 'START'; // START, PLAYING, GAMEOVER, WIN

const player = {
    x: 100,
    y: 300,
    width: 40,
    height: 35,
    vx: 0,
    vy: 0,
    speed: 5.5,
    jumpForce: -13.5, // Усиленный мощный прыжок
    grounded: false,
    facing: 'right',
    fishCount: 0,
    level: 1,
    lives: 3,
    lastCheckpoint: { x: 100, y: 300 },
    invulnerableTimer: 0
};

let cameraX = 0;

const platforms = [];
const fishes = [];
const checkpoints = [];
const projectiles = [];
const bossProjectiles = [];

function generateLevel() {
    platforms.length = 0;
    fishes.length = 0;
    checkpoints.length = 0;

    // Начальная площадка
    platforms.push({ x: 0, y: 500, w: 800, h: 100, type: 'ice' });
    
    // БИОМ 1: Ледяная долина (0 - 2000)
    let currentX = 750;
    while (currentX < 2000) {
        let w = 120 + Math.random() * 100;
        let gap = 80 + Math.random() * 90;
        let y = 380 + Math.random() * 120;
        platforms.push({ x: currentX + gap, y: y, w: w, h: 100, type: 'ice' });
        
        // Рыбки
        if (Math.random() > 0.3) {
            fishes.push({ x: currentX + gap + w/2, y: y - 30, collected: false });
        }
        currentX += gap + w;
    }

    checkpoints.push({ x: 2000, y: 350, reached: false });
    platforms.push({ x: 1950, y: 420, w: 200, h: 180, type: 'cave' });

    // БИОМ 2: Снежные пещеры (2000 - 4000)
    currentX = 2150;
    while (currentX < 4000) {
        let w = 100 + Math.random() * 90;
        let gap = 75 + Math.random() * 95;
        let y = 250 + Math.random() * 200;
        platforms.push({ x: currentX + gap, y: y, w: w, h: 40, type: 'cave' });
        
        if (Math.random() > 0.2) {
            fishes.push({ x: currentX + gap + w/2, y: y - 30, collected: false });
        }
        currentX += gap + w;
    }

    checkpoints.push({ x: 4000, y: 350, reached: false });
    platforms.push({ x: 3950, y: 420, w: 200, h: 180, type: 'mountain' });

    // БИОМ 3: Горные вершины (4000 - 5200)
    currentX = 4150;
    while (currentX < 5100) {
        let w = 90 + Math.random() * 70;
        let gap = 85 + Math.random() * 95;
        let y = 200 + Math.random() * 250;
        platforms.push({ x: currentX + gap, y: y, w: w, h: 40, type: 'mountain' });
        
        if (Math.random() > 0.2) {
            fishes.push({ x: currentX + gap + w/2, y: y - 30, collected: false });
        }
        currentX += gap + w;
    }

    // Арена Босса (5200 - 6000)
    platforms.push({ x: 5200, y: 450, w: 800, h: 150, type: 'mountain' });
    checkpoints.push({ x: 5250, y: 380, reached: false });
}

const boss = {
    x: 5700,
    y: 330,
    width: 40,
    height: 120,
    hp: 10,
    maxHp: 10,
    active: false,
    facing: 'left',
    attackTimer: 0,
    vx: 0,
    moveTimer: 0
};

function showToast(text) {
    const toast = document.getElementById('toast-msg');
    toast.innerText = text;
    toast.style.opacity = 1;
    setTimeout(() => { toast.style.opacity = 0; }, 2000);
}

function updateHUD() {
    document.getElementById('fish-count').innerText = player.fishCount;
    document.getElementById('level-count').innerText = player.level;
    document.getElementById('lives-count').innerText = player.lives;
    
    if (boss.active) {
        document.getElementById('boss-hp-container').style.display = 'block';
        const fillPercent = Math.max(0, (boss.hp / boss.maxHp) * 100);
        document.getElementById('boss-hp-fill').style.width = fillPercent + '%';
    } else {
        document.getElementById('boss-hp-container').style.display = 'none';
    }
}

function resetGame() {
    player.x = 100;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.fishCount = 0;
    player.level = 1;
    player.lives = 3;
    player.lastCheckpoint = { x: 100, y: 300 };
    boss.hp = boss.maxHp;
    boss.active = false;
    projectiles.length = 0;
    bossProjectiles.length = 0;
    generateLevel();
    updateHUD();
}

function update() {
    if (gameState !== 'PLAYING') return;

    // Горизонтальное движение
    if (inputState.left) {
        player.vx = -player.speed;
        player.facing = 'left';
    } else if (inputState.right) {
        player.vx = player.speed;
        player.facing = 'right';
    } else {
        player.vx *= 0.8;
    }

    // Высокий вариативный прыжок
    if (inputState.jumpPressed && player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
    }
    
    // Регулировка высоты прыжка при отпускании кнопки
    if (!inputState.jump && player.vy < -4) {
        player.vy = -4;
    }

    inputState.jumpPressed = false;

    // Применение гравитации
    player.vy += GRAVITY;

    // Обновление позиций
    player.x += player.vx;
    player.y += player.vy;

    // Столкновения с платформами
    player.grounded = false;
    for (let p of platforms) {
        if (player.x + player.width > p.x &&
            player.x < p.x + p.w &&
            player.y + player.height > p.y &&
            player.y + player.height < p.y + p.h + player.vy &&
            player.vy >= 0) {
            
            player.grounded = true;
            player.vy = 0;
            player.y = p.y - player.height;
        }
    }

    // Падение в пропасть
    if (player.y > WORLD_HEIGHT + 100) {
        player.lives--;
        showToast("Упс! Вы упали!");
        if (player.lives <= 0) {
            gameOver(false);
        } else {
            player.x = player.lastCheckpoint.x;
            player.y = player.lastCheckpoint.y;
            player.vx = 0;
            player.vy = 0;
        }
        updateHUD();
    }

    // Сбор рыбок
    fishes.forEach(f => {
        if (!f.collected && Math.hypot(player.x + player.width/2 - f.x, player.y + player.height/2 - f.y) < 25) {
            f.collected = true;
            player.fishCount++;
            
            if (player.fishCount % 4 === 0) {
                player.level++;
                if (player.lives < 5) player.lives++;
                showToast("Новый уровень! +1 жизнь ❤️");
            }
            updateHUD();
        }
    });

    // Чекпоинты
    checkpoints.forEach(cp => {
        if (!cp.reached && player.x > cp.x) {
            cp.reached = true;
            player.lastCheckpoint = { x: cp.x, y: cp.y };
            showToast("Контрольная точка сохранена! 🚩");
        }
    });

    // Активация босса
    if (player.x > 5300 && !boss.active && boss.hp > 0) {
        boss.active = true;
        showToast("Появился Саня! Бросай в него рыбки (Клавиша E)");
        updateHUD();
    }

    // Логика броска рыбок
    if (inputState.throwPressed && boss.active) {
        if (player.fishCount > 0) {
            player.fishCount--;
            projectiles.push({
                x: player.x + player.width/2,
                y: player.y + player.height/2,
                vx: player.facing === 'right' ? 10 : -10,
                vy: -2
            });
            updateHUD();
        } else {
            showToast("Закончились рыбки!");
        }
    }
    inputState.throwPressed = false;

    // Снаряды игрока
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (boss.active && p.x > boss.x && p.x < boss.x + boss.width &&
            p.y > boss.y && p.y < boss.y + boss.height) {
            
            boss.hp--;
            showToast("Попадание по Сане!");
            projectiles.splice(i, 1);
            updateHUD();

            if (boss.hp <= 0) {
                gameOver(true);
            }
            continue;
        }

        if (p.x < cameraX || p.x > cameraX + canvas.width) {
            projectiles.splice(i, 1);
        }
    }

    // ИИ Босса
    if (boss.active) {
        boss.moveTimer++;
        if (boss.moveTimer % 120 < 60) {
            boss.x += (player.x < boss.x) ? -1.5 : 1.5;
        }

        boss.attackTimer++;
        if (boss.attackTimer > 90) {
            boss.attackTimer = 0;
            bossProjectiles.push({
                x: boss.x + boss.width/2,
                y: boss.y + 30,
                vx: (player.x < boss.x) ? -6 : 6,
                vy: (Math.random() - 0.5) * 2
            });
        }
    }

    // Атаки босса
    for (let i = bossProjectiles.length - 1; i >= 0; i--) {
        let bp = bossProjectiles[i];
        bp.x += bp.vx;
        bp.y += bp.vy;

        if (player.invulnerableTimer <= 0 &&
            bp.x > player.x && bp.x < player.x + player.width &&
            bp.y > player.y && bp.y < player.y + player.height) {
            
            player.lives--;
            player.invulnerableTimer = 60;
            showToast("Саня атаковал вас!");
            bossProjectiles.splice(i, 1);
            updateHUD();

            if (player.lives <= 0) {
                gameOver(false);
            }
            continue;
        }

        if (bp.x < 5000 || bp.x > 6100) {
            bossProjectiles.splice(i, 1);
        }
    }

    if (player.invulnerableTimer > 0) {
        player.invulnerableTimer--;
    }

    // Плавное следование камеры
    let targetCameraX = player.x - canvas.width / 3;
    cameraX += (targetCameraX - cameraX) * 0.1;
    cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, cameraX));
}

function drawBackground() {
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#0d0f1d');
    grad.addColorStop(0.5, '#1a1c38');
    grad.addColorStop(1, '#2a2d54');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
    for (let i = 0; i < 50; i++) {
        let x = (i * 137.5 + cameraX * 0.2) % canvas.width;
        let y = (i * 91.3) % canvas.height;
        ctx.fillRect(canvas.width - x, y, (i % 3) + 1, (i % 3) + 1);
    }
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x - cameraX, player.y);

    if (player.invulnerableTimer % 10 > 5) {
        ctx.globalAlpha = 0.5;
    }

    let isLeft = player.facing === 'left';
    if (isLeft) {
        ctx.translate(player.width, 0);
        ctx.scale(-1, 1);
    }

    // Чёрный корпус кота
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.ellipse(20, 22, 18, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Белое брюшко
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(22, 25, 10, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Голова
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(30, 12, 11, 0, Math.PI * 2);
    ctx.fill();

    // Ушки
    ctx.beginPath();
    ctx.moveTo(23, 5); ctx.lineTo(27, 0); ctx.lineTo(29, 6); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(31, 6); ctx.lineTo(35, 0); ctx.lineTo(38, 5); ctx.fill();

    // Белые щечки
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(33, 15, 5, 0, Math.PI * 2);
    ctx.fill();

    // Жёлтые глазки
    ctx.fillStyle = '#ffea00';
    ctx.beginPath();
    ctx.arc(32, 10, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillRect(32, 9, 1, 2);

    // Лапки с белыми кончиками
    ctx.fillStyle = '#111';
    ctx.fillRect(8, 28, 6, 7);
    ctx.fillRect(26, 28, 6, 7);
    ctx.fillStyle = '#fff';
    ctx.fillRect(8, 33, 6, 3);
    ctx.fillRect(26, 33, 6, 3);

    // Хвостик
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(3, 20);
    ctx.quadraticCurveTo(-5, 10, -2, 5);
    ctx.stroke();

    ctx.restore();
}

function drawBoss() {
    if (!boss.active && player.x < 5000) return;

    ctx.save();
    ctx.translate(boss.x - cameraX, boss.y);

    // Отрисовка Сани
    // Ноги (черные спортивные штаны)
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(8, 60, 10, 60);
    ctx.fillRect(22, 60, 10, 60);
    
    // Белые полосы на штанах
    ctx.fillStyle = '#fff';
    ctx.fillRect(7, 60, 2, 60);
    ctx.fillRect(31, 60, 2, 60);

    // Белая футболка
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(5, 25, 30, 38);

    // Голова
    ctx.fillStyle = '#ffdbac';
    ctx.fillRect(10, 5, 20, 20);

    // Волосы (Wolf Cut)
    ctx.fillStyle = '#d4a373';
    ctx.beginPath();
    ctx.arc(20, 8, 13, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(7, 8, 6, 15);
    ctx.fillRect(27, 8, 6, 15);

    // Глаза (карие)
    ctx.fillStyle = '#582f0e';
    ctx.fillRect(13, 12, 3, 3);
    ctx.fillRect(22, 12, 3, 3);

    // Snake bites пирсинг
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(15, 22, 2, 2);
    ctx.fillRect(21, 22, 2, 2);

    ctx.restore();
}

function drawWorld() {
    // Отрисовка платформ
    for (let p of platforms) {
        if (p.x + p.w < cameraX || p.x > cameraX + canvas.width) continue;

        if (p.type === 'ice') {
            ctx.fillStyle = '#a2d2ff';
            ctx.strokeStyle = '#bde0fe';
        } else if (p.type === 'cave') {
            ctx.fillStyle = '#4a4e69';
            ctx.strokeStyle = '#9a8c98';
        } else {
            ctx.fillStyle = '#2b2d42';
            ctx.strokeStyle = '#8d99ae';
        }

        ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
        ctx.lineWidth = 3;
        ctx.strokeRect(p.x - cameraX, p.y, p.w, p.h);

        // Снежная шапка
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(p.x - cameraX, p.y, p.w, 6);
    }

    // Отрисовка рыбок
    fishes.forEach(f => {
        if (f.collected) return;
        if (f.x < cameraX - 20 || f.x > cameraX + canvas.width + 20) return;

        ctx.save();
        ctx.translate(f.x - cameraX, f.y);
        ctx.fillStyle = '#ff9e00';
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        // Хвост
        ctx.beginPath();
        ctx.moveTo(-8, 0); ctx.lineTo(-14, -5); ctx.lineTo(-14, 5); ctx.fill();
        ctx.restore();
    });

    // Снаряды рыбки
    projectiles.forEach(p => {
        ctx.fillStyle = '#ff9e00';
        ctx.beginPath();
        ctx.arc(p.x - cameraX, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
    });

    // Атаки босса
    bossProjectiles.forEach(bp => {
        ctx.fillStyle = '#ff4d4d';
        ctx.beginPath();
        ctx.arc(bp.x - cameraX, bp.y, 8, 0, Math.PI * 2);
        ctx.fill();
    });

    // Чекпоинты
    checkpoints.forEach(cp => {
        let x = cp.x - cameraX;
        ctx.fillStyle = cp.reached ? '#52b788' : '#e63946';
        ctx.fillRect(x, cp.y - 40, 4, 40);
        ctx.beginPath();
        ctx.moveTo(x + 4, cp.y - 40);
        ctx.lineTo(x + 24, cp.y - 30);
        ctx.lineTo(x + 4, cp.y - 20);
        ctx.fill();
    });
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    drawWorld();
    drawPlayer();
    drawBoss();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

function gameOver(win) {
    gameState = win ? 'WIN' : 'GAMEOVER';
    const modal = document.getElementById('game-modal');
    const title = document.getElementById('modal-title');
    const desc = document.getElementById('modal-desc');
    const btn = document.getElementById('modal-btn');

    modal.style.display = 'flex';
    if (win) {
        title.innerText = "ПОБЕДА!";
        desc.innerText = "Поздравляем! Чиллибон успешно победил Саню и прошёл всё Ледяное приключение!";
        btn.innerText = "Сиграть ещё раз";
    } else {
        title.innerText = "ПОРАЖЕНИЕ";
        desc.innerText = "У Чиллибона закончились жизни. Не сдавайтесь и попробуйте снова!";
        btn.innerText = "Попробовать снова";
    }
}

document.getElementById('modal-btn').addEventListener('click', () => {
    document.getElementById('game-modal').style.display = 'none';
    resetGame();
    gameState = 'PLAYING';
});

// Старт программы
gameLoop();
</script>
</body>
</html>
